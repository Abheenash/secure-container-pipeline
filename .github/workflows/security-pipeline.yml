name: security-pipeline

# Four hard gates — secrets, IaC misconfig, image/dependency CVEs, and the app's own
# tests — that must all pass before code can merge. Then, on main, the image is built
# once, its SBOM is attached as an artifact, and (when DEPLOY_ENABLED=true) it is pushed
# to ECR and signed keylessly with Sigstore cosign via GitHub's OIDC identity.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (secrets)
        # Not gitleaks-action: it scans a commit RANGE (base^..head), and on a
        # repo's first push the base is the root commit, which has no parent —
        # git errors out and the job fails without scanning anything. Scanning
        # the tree directly works whatever the history looks like.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose --exit-code 1
  iac-scan:
    name: checkov + tfsec (terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # external-checks-dir loads policies/ — this repo's own policy-as-code, on
      # top of checkov's built-ins. CKV_SCP_1 exists because the pipeline used to
      # assert the image's uid but nothing asserted the task definition couldn't
      # override it back to root.
      - name: checkov (built-in + this repo's policies)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: .checkov.yaml
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          # reviewed baseline of accepted findings (public ALB, HTTP-only unless a cert is
          # supplied, AWS-managed keys, egress for VPC endpoints, no flow logs) — see .checkov.yaml
          additional_args: --exclude aws-cloudwatch-log-group-customer-key,aws-dynamodb-table-customer-key,aws-ec2-no-public-egress-sgr,aws-ec2-no-public-ingress-sgr,aws-ec2-require-vpc-flow-logs-for-all-vpcs,aws-elb-alb-not-public,aws-elb-http-not-used,aws-sns-topic-encryption-use-cmk,aws-ssm-secret-use-customer-key
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate

  unit-tests:
    name: pytest (moto + real DynamoDB Local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r app/requirements.txt -r tests/requirements.txt

      # The engine AWS ships for offline use — same wire protocol and error codes
      # as the service, no account, no cost. Started with `docker run` rather than
      # a `services:` block because the image needs its own arguments (-inMemory
      # -sharedDb) and service containers cannot override a CMD.
      - name: start DynamoDB Local
        run: |
          docker run -d --name ddb-local -p 8000:8000 amazon/dynamodb-local:3.1.0 \
            -jar DynamoDBLocal.jar -inMemory -sharedDb
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000 || true)
            case "$code" in 2*|4*) echo "DynamoDB Local is up"; exit 0;; esac
            sleep 1
          done
          echo "::error::DynamoDB Local never became reachable"; docker logs ddb-local; exit 1

      # REQUIRE_DDB=1 makes a missing endpoint an error rather than a skip. Without
      # it, a container that failed to start would skip six tests and still go green.
      - run: python -m pytest tests -q
        env:
          REQUIRE_DDB: "1"

      - if: always()
        run: docker rm -f ddb-local || true

  image-scan:
    name: trivy (image + deps) + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -t scp:ci .
      # Pinned, not @main. The trivy supply chain was compromised twice in March
      # 2026 (CVE-2026-33634): mutable tags and the install script on a moving
      # branch were the delivery path. The malicious releases were v0.69.4/.5/.6;
      # v0.74.0 is well past remediation, and the script is fetched at that tag.
      - name: install trivy (pinned)
        env:
          TRIVY_VERSION: v0.74.0
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version
      - name: trivy image + dependency scan (HIGH/CRITICAL, fixed only)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table scp:ci
      - name: trivy secret scan of the image layers
        run: trivy image --scanners secret --exit-code 1 scp:ci
      - name: generate SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json scp:ci
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
      - name: image must run as non-root
        run: |
          uid=$(docker run --rm --entrypoint id scp:ci -u)
          test "$uid" = "10001" || { echo "container runs as uid $uid, expected 10001"; exit 1; }

  # Continuous delivery — wired end to end, enabled with the repository variable
  # DEPLOY_ENABLED=true (the stack is normally torn down between demos, so the job
  # is idle by default). Assumes the OIDC deploy role: no long-lived AWS keys anywhere.
  deploy:
    name: push to ECR + cosign sign (main only)
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [secrets-scan, iac-scan, unit-tests, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC for AWS, Sigstore and the attestation signer
      attestations: write  # required by actions/attest-*
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: build and push (amd64 — Fargate's architecture)
        id: push
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/secure-container-pipeline
        run: |
          docker build --platform linux/amd64 -t "$REPO:${GITHUB_SHA::12}" .
          docker push "$REPO:${GITHUB_SHA::12}"
          DIGEST_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$REPO:${GITHUB_SHA::12}")"
          echo "digest=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          # attest-* want the bare sha256:... , cosign wants the full repo@sha256:...
          echo "digest_only=${DIGEST_REF#*@}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: sign the image by digest (keyless, GitHub OIDC identity)
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"
      - name: verify the signature we just made
        run: |
          cosign verify "${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # A signature proves "this repo's workflow signed this digest". Provenance
      # proves *how* it was built — which workflow file, which commit, which
      # runner — in the in-toto SLSA format a consumer can check policy against.
      # Signing without provenance is the half of supply-chain security that is
      # easy to demo; this is the half that actually answers "where did this
      # image come from?".
      - name: attest build provenance (SLSA, in-toto)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/secure-container-pipeline
          subject-digest: ${{ steps.push.outputs.digest_only }}
          push-to-registry: true

      - name: install trivy (pinned) for the release SBOM
        env:
          TRIVY_VERSION: v0.74.0
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      - name: regenerate the SBOM for the pushed image
        run: |
          trivy image --format cyclonedx --output sbom.release.cdx.json "${{ steps.push.outputs.digest }}"

      - name: attest the SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/secure-container-pipeline
          subject-digest: ${{ steps.push.outputs.digest_only }}
          sbom-path: sbom.release.cdx.json
          push-to-registry: true

      - name: roll the service to the new image
        run: |
          aws ecs update-service --cluster secure-container-pipeline --service secure-container-pipeline \
            --force-new-deployment --query 'service.deployments[0].{status:status,rollout:rolloutState}'

  # tflint catches what `terraform validate` cannot: unused declarations, missing
  # provider version constraints, invalid instance types. It found an unpinned
  # `archive` provider in two of these repos.
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: ${{ github.workspace }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --chdir=terraform --config="${{ github.workspace }}/.tflint.hcl"

  # `terraform test` against a mocked provider: no cloud account, no cost, and it
  # asserts the specific promises this repo's README makes — which a generic
  # scanner cannot know.
  terraform-test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_wrapper: false }
      - name: terraform test
        working-directory: ${{ github.workspace }}/terraform
        run: |
          terraform init -backend=false
          terraform test

  # Lint, including bandit's security rules. Every exclusion in ruff.toml carries
  # the reason it is there — a silent exclusion is indistinguishable from a bug
  # nobody noticed.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.8
          args: check --output-format github

  # GitHub's semantic analysis, free on public repos, reporting into the Security
  # tab. It reads data flow across files, which neither ruff nor checkov does.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  # Blocks a PR that introduces a dependency with a known vulnerability or a
  # licence that does not fit. Renovate keeps things current; this stops a bad
  # one arriving in the first place.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Requires "Dependency graph" enabled in repo settings, which a workflow
    # cannot turn on for itself. Non-blocking so a repo without it reports the
    # gap instead of failing every PR.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
